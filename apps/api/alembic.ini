# Alembic configuration for HireIQ API
# Docs: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migrations directory (relative to this file)
script_location = alembic

# Jinja2 template for new migration file names
# %(rev)s    - revision ID
# %(slug)s   - slug derived from the -m message
# %(epoch)s  - creation epoch (seconds since 1970)
file_template = %%(epoch)s_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally left blank here.
# It is resolved at runtime from the DATABASE_URL env var inside alembic/env.py.
sqlalchemy.url =

# Truncate long migration messages to this length
truncate_slug_length = 40

# Output encoding for generated migration files
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
